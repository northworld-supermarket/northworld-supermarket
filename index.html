<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amanah — Northworld Supermarket Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Playfair+Display:ital,wght@0,800;1,500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f6f1;--panel:#fff;--ink:#13200f;--muted:#5f6b58;--line:#e2e7dc;
  --navy:#14320f;--navy2:#1d4a17;--brand:#2d6a1f;--brand2:#3a7d2a;--brandSoft:#edf2e4;
  --accent:#7a8c4a;--accentSoft:#f1f4e8;
  --green:#15803d;--greenSoft:#e7f6ec;--red:#c23a2b;--redSoft:#fdeceA;--amber:#b56b00;--amberSoft:#fff4df;
  --r:12px;--sh:0 1px 2px rgba(20,50,15,.05),0 2px 8px rgba(20,50,15,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;background:var(--navy);color:#d3dcc6;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:16px 16px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #2a5222}
.logo{justify-content:center}.logo img{display:block;width:100%;max-width:204px;height:auto;max-height:90px;object-fit:contain;background:transparent;padding:0}
.rhead img,.card .row>img{height:60px;width:auto;max-width:170px;object-fit:contain}
.logo .wm b{display:block;color:#fff;font-size:16px;letter-spacing:1.4px;font-weight:800;line-height:1.1}
.logo .wm span{font-size:10px;color:#c2caac;text-transform:uppercase;letter-spacing:1.6px;font-weight:600}
.rolebox{margin:12px 12px 4px;background:#1d4a17;border-radius:10px;padding:9px}
.rolebox label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9fb38f}
.rolebox select{width:100%;margin-top:4px;background:#14320f;color:#fff;border:1px solid #3a6630;border-radius:6px;padding:6px}
.nav{padding:8px;flex:1}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#7f9670;padding:10px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#d3dcc6;text-decoration:none;cursor:pointer;margin-bottom:1px;font-weight:500}
.nav a:hover{background:#1d4a17}
.nav a.on{background:var(--brand2);color:#fff}
.nav a .i{width:18px;text-align:center;opacity:.9}
.nav a .cnt{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px;font-weight:700}
.nav a.locked{display:none}
.sidefoot{padding:12px 16px;border-top:1px solid #2a5222;font-size:11px;color:#9fb38f;line-height:1.5}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.burger{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:0 4px}
.gsw{position:relative;flex:1;max-width:520px;margin-left:auto}
.gsw input{width:100%;border:1px solid var(--line);background:#f6f8f3;border-radius:10px;padding:9px 12px 9px 34px}
.gsw input:focus{outline:2px solid var(--brandSoft);border-color:var(--brand2);background:#fff}
.gsw .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,50,15,.15);max-height:70vh;overflow:auto;display:none;z-index:30}
.gsr.on{display:block}
.gsr .gh{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 14px 4px;font-weight:700}
.gsr .gi{padding:8px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.gsr .gi:hover{background:var(--brandSoft)}
.gsr .gi small{color:var(--muted);margin-left:auto;white-space:nowrap}
.sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:17px;flex-shrink:0}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px}
.np{position:absolute;right:22px;top:58px;width:380px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,50,15,.18);display:none;z-index:30;max-height:75vh;overflow:auto}
.np.on{display:block}
.np .nh{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex}
.np .ni{padding:9px 14px;border-bottom:1px solid #f0f3ec;cursor:pointer;display:flex;gap:10px;font-size:13px}
.np .ni:hover{background:#f6f8f3}
.content{padding:20px 22px 40px;max-width:1440px;width:100%}
/* ui */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}.k5{grid-template-columns:repeat(5,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.mt{margin-top:14px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi{border-top:3px solid var(--brand2)}
.kpi.o{border-top-color:var(--accent)}.kpi.g{border-top-color:var(--green)}.kpi.rd{border-top-color:var(--red)}
.up{color:var(--green)}.dn{color:var(--red)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbf8}
td{padding:9px 10px;border-bottom:1px solid #eef1ea;vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.tw{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-g{background:var(--greenSoft);color:var(--green)}.b-r{background:var(--redSoft);color:var(--red)}.b-a{background:var(--amberSoft);color:var(--amber)}.b-b{background:var(--brandSoft);color:var(--brand)}.b-n{background:#eef1ea;color:var(--muted)}.b-o{background:var(--accentSoft);color:#b45f00}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f5f7f2}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff}.btn.p:hover{background:var(--brand)}
.btn.o{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}.btn.wa:hover{background:#1ebe5b}
.btn.d{color:var(--red)}.btn.d:hover{background:var(--redSoft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand2);border-color:var(--brand2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.alert{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:12px}
/* hero */
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2) 60%,#2c5a24);color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{margin:0;font-size:20px}
.hero p{margin:4px 0 0;color:#c5d2b5;font-size:13px}
.ticker{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;font-size:12px;max-width:520px;min-width:240px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.qa button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:.15s}
.qa button:hover{border-color:var(--brand2);transform:translateY(-1px)}
.qa .qi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--brandSoft);margin-bottom:8px}
.qa b{display:block;font-size:13px}.qa span{font-size:11px;color:var(--muted)}
.summary p{margin:0 0 10px;line-height:1.6}
.summary p b{color:var(--navy)}
.speak.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini div{background:#f6f8f3;border-radius:10px;padding:10px}
.mini .l{font-size:11px;color:var(--muted);font-weight:600}.mini .v{font-weight:800;font-size:16px;margin-top:2px}
.fc td{padding:7px 4px}
/* POS */
.pos{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:60vh;overflow:auto;padding:2px}
.pt{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:#fff;text-align:left}
.pt:hover{border-color:var(--brand2);box-shadow:0 0 0 2px var(--brandSoft)}
.pt .n{font-weight:600;font-size:13px;line-height:1.25;min-height:32px}
.pt .p{color:var(--brand);font-weight:800;margin-top:6px}
.pt .q{font-size:11px;color:var(--muted)}
.pt.out{opacity:.4;pointer-events:none}
.cl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef1ea}
.cl .n{flex:1;font-weight:500}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:26px;height:26px;cursor:pointer;font-weight:700}
.qty span{min-width:22px;text-align:center}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.g{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:10px 0}
.pay button{padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:700}
.pay button.on{border-color:var(--brand2);background:var(--brandSoft);color:var(--brand)}
/* live */
.feed{max-height:560px;overflow:auto}
.fi{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #eef1ea;font-size:13px}
.fi .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.fi .tm{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.fi.new{animation:nw 1.5s}
@keyframes nw{0%{background:var(--accentSoft)}100%{background:transparent}}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* reports */
.rc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rc button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.rc button:hover{border-color:var(--brand2);background:#fbfdf9}
.rc b{display:block;font-size:13px}.rc span{font-size:12px;color:var(--muted)}
.rhead{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.rhead .t{font-size:18px;font-weight:800}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.fs{flex:1;min-width:110px;background:var(--brandSoft);border-radius:10px;padding:9px}
.fs b{display:block;font-size:12px;color:var(--brand)}.fs span{font-size:11px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(12,28,9,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mb.on{display:flex}
.modal.wide{max-width:1040px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 14px;font-size:17px}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;z-index:60;opacity:0;transform:translateY(10px);transition:.25s;max-width:360px;font-size:13px;pointer-events:none}
.toast.on{opacity:1;transform:none}
.receipt{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fafafa;border:1px dashed #bbb;padding:14px;border-radius:8px;white-space:pre;overflow:auto}
.bar{height:8px;background:#eef1ea;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2)}
canvas{max-width:100%}
@media(max-width:1100px){.k4,.k5{grid-template-columns:repeat(2,1fr)}.k3{grid-template-columns:1fr 1fr}.pos,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:760px){
  .side{position:fixed;left:-250px;z-index:40;transition:.25s}.side.on{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .burger{display:block}.content{padding:12px 12px 40px}.k2,.k3{grid-template-columns:1fr}.top{padding:8px 10px;gap:8px;flex-wrap:wrap}.top h1{font-size:15px}
  .hidem{display:none}.gsw{order:5;flex-basis:100%;max-width:none}.np{right:8px;top:100px}.ticker{margin-left:0;min-width:0;width:100%}.mini{grid-template-columns:1fr 1fr}
}

/* ================= Northworld sign-in ================= */
body.locked .app{display:none}
#auth{position:fixed;inset:0;z-index:9000;display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#f4f6f1;font-family:Inter,system-ui,sans-serif;color:#13200f;overflow:auto}
body.locked #auth{display:grid}
#auth .au-hero{position:relative;margin:0;padding:clamp(18px,3vw,40px);background:radial-gradient(ellipse at 45% 35%,#2b5a22 0%,#1a3f14 45%,#10280c 100%);color:#e9eedd;display:flex;min-height:100vh;overflow:hidden}
#auth .au-frame{position:relative;flex:1;border:1.5px solid rgba(194,202,172,.35);border-radius:26px;padding:clamp(22px,3.4vw,52px);display:flex;flex-direction:column;box-shadow:inset 0 0 0 10px rgba(255,255,255,.02)}
#auth .au-brand{display:flex;align-items:center;gap:16px}
#auth .au-badge{width:64px;height:64px;border-radius:16px;background:#14320f;border:1px solid rgba(194,202,172,.4);display:flex;align-items:center;justify-content:center;flex:none}
#auth .au-badge img{width:54px}
#auth .au-brand b{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,28px);letter-spacing:2px;color:#fff}
#auth .au-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0}
#auth .au-center img{width:min(420px,80%);filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
#auth .au-rule{display:flex;align-items:center;gap:14px;width:min(380px,74%);margin:26px 0 18px;color:#c2caac}
#auth .au-rule:before,#auth .au-rule:after{content:"";flex:1;height:1px;background:rgba(194,202,172,.55)}
#auth .au-rule i{width:10px;height:10px;border:1.5px solid #c2caac;transform:rotate(45deg)}
#auth .au-tag{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(24px,2.6vw,36px);color:#e6ebc9;line-height:1.15}
#auth .au-sub{margin-top:14px;color:#c9d3b7;letter-spacing:.8px;font-size:15px}
#auth .au-foot{color:#b7c4a3;font-size:14px}
#auth .au-bub{position:absolute;border:1.5px solid rgba(194,202,172,.18);border-radius:50%}
#auth .au-side2{display:flex;align-items:center;justify-content:center;padding:32px 18px;min-height:100vh}
#auth .au-card2{width:min(470px,100%);background:#fff;border:1px solid #e3dccb;border-radius:28px;padding:clamp(26px,3.4vw,46px);box-shadow:0 30px 60px -30px rgba(20,50,15,.25)}
#auth .au-mini{display:flex;align-items:center;gap:14px;color:#3b4a35;font-size:17px}
#auth .au-mini span.au-ic{width:52px;height:52px;border-radius:13px;border:1px solid #e2e7dc;display:flex;align-items:center;justify-content:center;background:#fff}
#auth .au-mini img{width:44px}
#auth h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(34px,4vw,48px);margin:26px 0 8px;letter-spacing:-.5px;line-height:1.05;color:#13200f}
#auth .au-lead{color:#55624e;margin:0 0 24px;font-size:16px;line-height:1.5}
#auth .au-tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid #e2e7dc;margin-bottom:26px}
#auth .au-tabs2 button{background:none;border:0;padding:12px;font:600 17px Inter,sans-serif;color:#5f6b58;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
#auth .au-tabs2 button.on{color:#14320f;border-color:#14320f}
#auth label.au-l{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin:0 0 8px;color:#13200f}
#auth label.au-l a{font-weight:500;color:#13200f;text-decoration:none}
#auth .au-inp{position:relative;margin-bottom:20px}
#auth input,#auth select{width:100%;height:54px;border:1px solid #dfe3d8;border-radius:14px;background:#fafbf8;padding:0 18px;font:16px Inter,sans-serif;color:#13200f;outline:none}
#auth input:focus,#auth select:focus{border-color:#3a7d2a;box-shadow:0 0 0 3px rgba(58,125,42,.15);background:#fff}
#auth .au-eye{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;background:none;cursor:pointer;color:#3b4a35;border-radius:10px}
#auth .au-go{width:100%;height:56px;border:0;border-radius:16px;background:#1a3f14;color:#fff;font:600 18px Inter,sans-serif;cursor:pointer;margin-top:4px}
#auth .au-go:hover{background:#14320f}#auth .au-go:disabled{opacity:.6;cursor:wait}
#auth .au-ghost{width:100%;height:50px;border:1px solid #dfe3d8;border-radius:14px;background:#fff;color:#14320f;font:600 16px Inter,sans-serif;cursor:pointer;margin-top:12px}
#auth .au-alt{text-align:center;color:#6b7764;margin-top:20px;font-size:15px}
#auth .au-alt a{color:#14320f;font-weight:700;text-decoration:underline}
#auth .au-msg{border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin-bottom:18px}
#auth .au-msg.au-err{background:#fdeceA;color:#9b2c1f}#auth .au-msg.au-ok{background:#e7f6ec;color:#15602e}#auth .au-msg.au-info{background:#edf2e4;color:#2d4a22}
#auth .au-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#auth .au-big{font-size:46px;text-align:center;margin:10px 0 0}
#auth .au-meter{height:6px;border-radius:4px;background:#eef1ea;margin:-12px 0 18px;overflow:hidden}#auth .au-meter i{display:block;height:100%;width:0;transition:.3s}
.whoami{margin:12px 12px 4px;background:#1d4a17;border-radius:10px;padding:10px 11px;color:#e3e9d6;font-size:13px}
.whoami b{display:block;color:#fff;font-size:14px}.whoami span{color:#c2caac;font-size:11.5px;text-transform:uppercase;letter-spacing:1px}
.whoami button{margin-top:8px;width:100%;background:transparent;border:1px solid #3a6630;color:#e3e9d6;border-radius:8px;padding:6px;cursor:pointer;font:inherit}
.whoami button:hover{background:#2a5222}
@media(max-width:900px){#auth{grid-template-columns:1fr}#auth .au-hero{min-height:auto}#auth .au-frame{border-radius:20px}#auth .au-center{padding:18px 0 4px}#auth .au-center img{width:min(300px,70%)}#auth .au-sub,#auth .au-foot,#auth .au-bub{display:none}#auth .au-side2{min-height:auto;padding-top:20px}}
@media(max-width:480px){#auth .au-two{grid-template-columns:1fr}#auth .au-brand b{font-size:18px}#auth .au-badge{width:50px;height:50px}#auth .au-badge img{width:42px}}

 openM(`<h2>Shift closing — ${BR[b]}</h2><table><tr><td>Opening float</td><td class="num">${ks(S.shift.float)}</td></tr><tr><td>Cash sales</td><td class="num">${ks(pm.Cash)}</td></tr><tr><td>M-Pesa sales</td><td class="num">${ks(pm['M-Pesa'])}</td></tr><tr><td>Card sales</td><td class="num">${ks(pm.Card)}</td></tr><tr><td><b>Expected cash in drawer</b></td><td class="num"><b>${ks(exp)}</b></td></tr></table>
 <div class="fg" style="margin-top:12px"><label>Counted cash (KES)</label><input class="in" type="number" id="counted" value="${Math.round(exp)}" oninput="$('#var').innerHTML=varTxt(+this.value-${Math.round(exp)})"></div><div id="var">${varTxt(0)}</div>
 <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="recShift('${b}',${Math.round(exp)},${pm.Cash},${pm['M-Pesa']},${pm.Card})">Reconcile & close</button></div>`)}
function varTxt(v){return v===0?'<span class="badge b-g">Balanced</span>':`<span class="badge ${v<0?'b-r':'b-a'}">${v<0?'Shortage':'Excess'} ${ks(Math.abs(v))}</span>`}

/* ================= DELETE / RECYCLE BIN ================= */
function delAsk(kind,rid){if(!canDel()&&!(kind==='expense'&&S.role==='Accountant')){toast('Only managers can delete records');return}
 const label={product:()=>prod(rid).name,customer:()=>S.customers.find(c=>c.id===rid).name,expense:()=>{const e=S.expenses.find(x=>x.id===rid);return e.desc+' · '+ks(e.amount)},sale:()=>rid+' · '+ks(S.sales.find(x=>x.id===rid).total),po:()=>rid}[kind]();
 openM(`<h2>${kind==='sale'?'Void transaction':'Delete '+kind}</h2><p><b>${esc(label)}</b></p><div class="alert" style="background:var(--redSoft);color:var(--red)">This action is recorded in the audit log with your name, the time and the old value.${kind!=='sale'?' The record moves to the Recycle Bin and can be restored.':''}</div>
 <div class="fg"><label>Reason (required)</label><input class="in" id="dr" placeholder="e.g. duplicate entry"></div><div class="row"><span class="sp"></span><button class="btn" onclick="closeM()">Cancel</button><button class="btn d" style="border-color:var(--red)" onclick="doDel('${kind}','${rid}')">${kind==='sale'?'Void':'Delete'}</button></div>`)}
function doDel(kind,rid){const why=$('#dr').value.trim();if(!why){toast('Please give a reason');return}
 if(kind==='sale'){const tx=S.sales.find(x=>x.id===rid);tx.status='Voided';tx.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock[tx.branch]+=i.qty;p.sold30-=i.qty}});log('Void transaction',rid,ks(tx.total),'Voided — '+why,'delete')}
 else{const L={product:S.products,customer:S.customers,expense:S.expenses,po:S.pos}[kind];const i=L.findIndex(x=>x.id===rid);const item=L.splice(i,1)[0];
  const lbl=item.name||item.desc||item.id;S.bin.unshift({kind,item,by:user(),role:S.role,t:TODAY+' '+nowT().slice(0,5),why});log('Deleted '+kind,lbl,kind==='expense'?ks(item.amount):kind==='product'?ks(item.price)+' · stock '+stockOf(item,'All'):'Record',`Deleted — ${why}`,'delete')}
 closeM();toast(kind==='sale'?'Transaction voided':'Moved to Recycle Bin');render()}
function restore(i){const b=S.bin.splice(i,1)[0];({product:S.products,customer:S.customers,expense:S.expenses,po:S.pos,supplier:S.suppliers})[b.kind].push(b.item);log('Restored '+b.kind,b.item.name||b.item.desc||b.item.id,'Deleted','Restored','edit');toast('Record restored');render()}

 return `${roNote()}<div class="card"><div class="row" style="margin-bottom:10px"><input class="in" style="max-width:300px" placeholder="Filter name, barcode, brand…" value="${esc(prodQ)}" oninput="prodQ=this.value;const p=this.selectionStart;render();$('#pq').focus();$('#pq').setSelectionRange(p,p)" id="pq">
 <select class="in" style="width:auto" onchange="prodF=this.value;render()">${[['all','All products'],['low','Low stock'],['nm','Not moving'],['exp','Expiring ≤7 days'],...DEPTS.map(d=>[d,d])].map(([k,l])=>`<option value="${k}" ${prodF===k?'selected':''}>${l}</option>`).join('')}</select><span class="small muted">${L.length} items</span><span class="sp"></span>${ro()?'':'<button class="btn p" onclick="prodForm()">+ New product</button>'}</div>
 <div class="tw"><table><tr><th>Product</th><th>Barcode</th><th>Dept</th><th>Supplier</th><th class="num">Buy</th><th class="num">Sell</th><th class="num">Margin</th><th class="num">Stock</th><th>Movement</th><th>Expiry</th><th></th></tr>
 ${L.map(p=>{const s=stockOf(p);const mv=idle(p)>=30?'<span class="badge b-r">Not moving</span>':p.sold30<60?'<span class="badge b-a">Slow</span>':p.sold30>800?'<span class="badge b-g">Fast</span>':'<span class="badge b-n">Normal</span>';

function prodForm(pid){const p=pid?prod(pid):{name:'',dept:DEPTS[0],brand:'',unit:'pc',cost:0,price:0,supplier:'S1',min:10,max:100,expiry:addD(180),tax:16,barcode:'6161'+Date.now().toString().slice(-9)};
 openM(`<h2>${pid?'Edit':'New'} product</h2><div class="fg"><label>Name</label><input class="in" id="f_name" value="${esc(p.name)}"></div>

 <div class="fg"><label>VAT %</label><select class="in" id="f_tax"><option ${p.tax==16?'selected':''}>16</option><option ${p.tax==0?'selected':''}>0</option></select></div><div class="fg"><label>Supplier</label><select class="in" id="f_supplier">${S.suppliers.map(s=>`<option value="${s.id}" ${s.id===p.supplier?'selected':''}>${s.name}</option>`).join('')}</select></div>
 <div class="fg"><label>Min stock</label><input class="in" type="number" id="f_min" value="${p.min}"></div><div class="fg"><label>Max stock</label><input class="in" type="number" id="f_max" value="${p.max}"></div></div>

 <div class="row"><span class="sp"></span><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="saveProd('${pid||''}')">Save</button></div>`)}
function saveProd(pid){const g=k=>$('#f_'+k).value;const d={name:g('name').trim(),barcode:g('barcode'),brand:g('brand'),dept:g('dept'),unit:g('unit'),cost:+g('cost'),price:+g('price'),tax:+g('tax'),supplier:g('supplier'),min:+g('min'),max:+g('max'),expiry:g('expiry')};
 if(!d.name){toast('Name required');return}
 if(pid){const p=prod(pid);const ch=[];['price','cost','name','min','max','supplier','expiry'].forEach(k=>{if(String(p[k])!==String(d[k]))ch.push(k)});
  ch.forEach(k=>log(k==='price'?'Price change':'Product edited ('+k+')',p.name,k==='price'||k==='cost'?ks(p[k]):p[k],k==='price'||k==='cost'?ks(d[k]):d[k],'edit'));Object.assign(p,d)}
 else{S.products.push({id:id('P'),...d,stock:{B1:0,B2:0,B3:0},sold30:0,lastSold:TODAY});log('Product created',d.name,'-',ks(d.price),'edit')}
 closeM();toast('Product saved');render()}

 if(invTab==='levels')body=`<div class="row" style="margin-bottom:10px"><span class="sp"></span>${ro()?'':`<button class="btn" onclick="moveForm('Stock-in')">+ Stock-in</button><button class="btn" onclick="moveForm('Transfer')">⇄ Transfer</button><button class="btn" onclick="moveForm('Damaged')">Damaged/Expired</button><button class="btn" onclick="moveForm('Adjustment')">Adjustment</button>`}</div>

  ${S.products.map(p=>{const d=daysTo(p);return `<tr><td>${esc(p.name)}</td>${BK.map(b=>`<td class="num ${p.stock[b]<=minB(p,b)?'dn':''}"><b>${p.stock[b]}</b></td>`).join('')}<td class="num muted">${p.min}</td><td class="num muted">${p.max}</td><td>${isLow(p,'All')?'<span class="badge b-r">Reorder</span>':'<span class="badge b-g">OK</span>'}</td><td>${d<=0?'<span class="badge b-r">Expired</span>':d<=7?`<span class="badge b-a">${d} days</span>`:'<span class="small muted">'+(p.expiry||'—')+'</span>'}</td></tr>`}).join('')}</table></div>`;
 if(invTab==='movements')body=`<div class="tw"><table><tr><th>Date</th><th>Type</th><th>Product</th><th>Branch</th><th class="num">Qty</th><th>Reference</th><th>By</th></tr>${S.moves.filter(m=>inB(m.branch)).map(m=>`<tr><td>${m.t}</td><td><span class="badge ${m.qty>0?'b-g':'b-r'}">${m.type}</span></td><td>${esc((prod(m.pid)||{name:'(deleted)'}).name)}</td><td>${BR[m.branch]}</td><td class="num">${m.qty>0?'+':''}${m.qty}</td><td class="small">${esc(m.ref)}</td><td>${esc(m.user)}</td></tr>`).join('')}</table></div>`;
 if(invTab==='stocktake'){const b=posB();body=`<p class="small muted">Enter physical counts for <b>${BR[b]}</b>. Variances post as adjustments and are written to the audit log.</p><div class="tw"><table><tr><th>Product</th><th class="num">System</th><th class="num">Counted</th><th class="num">Variance</th><th class="num">Value</th></tr>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.stock[b]}</td><td class="num"><input class="in stc" data-id="${p.id}" type="number" style="width:80px;text-align:right" value="${p.stock[b]}" oninput="stv(this)" ${ro()?'disabled':''}></td><td class="num" id="v_${p.id}">0</td><td class="num" id="vv_${p.id}">0</td></tr>`).join('')}</table></div>${ro()?'':'<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" onclick="postStock()">Post stocktake</button></div>'}`}
 if(invTab==='valuation'){const se=stockExp();const rows=DEPTS.map(d=>{const ps=S.products.filter(p=>p.dept===d);return [d,ps.reduce((a,p)=>a+stockOf(p),0),ps.reduce((a,p)=>a+stockOf(p)*p.cost,0),ps.reduce((a,p)=>a+stockOf(p)*p.price,0)]});
  body=`<div class="grid k4" style="margin-bottom:14px">${kpi('Stock at cost',ks(se.cost))}${kpi('Expected revenue',ks(se.retail),'At current selling prices','o')}${kpi('Expected gross profit',ks(se.gp),pc(se.gp,se.retail)+' of revenue','g')}${kpi('Likely sold by month end',ks(se.month),se.left+' days left')}</div><div class="tw"><table><tr><th>Department</th><th class="num">Units</th><th class="num">Value at cost</th><th class="num">Expected revenue</th><th class="num">Expected profit</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${kn(r[1])}</td><td class="num">${ks(r[2])}</td><td class="num">${ks(r[3])}</td><td class="num up">${ks(r[3]-r[2])}</td></tr>`).join('')}<tfoot><tr><td>Total</td><td class="num">${kn(rows.reduce((a,r)=>a+r[1],0))}</td><td class="num">${ks(se.cost)}</td><td class="num">${ks(se.retail)}</td><td class="num">${ks(se.gp)}</td></tr></tfoot></table></div>`}
 if(invTab==='analysis')body=`<div class="tw"><table><tr><th>Product</th><th class="num">Sold (30d)</th><th class="num">On hand</th><th class="num">Days of cover</th><th>Last sold</th><th>Class</th></tr>${[...S.products].sort((a,b)=>b.sold30-a.sold30).map(p=>{const cover=stockOf(p)/Math.max(.01,rate(p));const cls=idle(p)>=30?['Not moving','b-r']:p.sold30<60?['Slow-moving','b-a']:p.sold30>800?['Fast-moving','b-g']:['Normal','b-n'];return `<tr><td>${esc(p.name)}</td><td class="num">${kn(p.sold30)}</td><td class="num">${stockOf(p)}</td><td class="num">${cover>365?'365+':Math.round(cover)}</td><td class="small">${p.lastSold}</td><td><span class="badge ${cls[1]}">${cls[0]}</span></td></tr>`}).join('')}</table></div>`;
 if(invTab==='production')body=prodBody();if(invTab==='containers')body=contBody();
 return `${roNote()}<div class="card"><div class="tabs">${Object.keys(L).map(k=>`<button class="${invTab===k?'on':''}" onclick="invTab='${k}';render()">${L[k]}</button>`).join('')}</div>${body}</div>`};
function stv(el){const p=prod(el.dataset.id);const v=+el.value-p.stock[posB()];$('#v_'+p.id).innerHTML=`<span class="${v<0?'dn':v>0?'up':''}">${v>0?'+':''}${v}</span>`;$('#vv_'+p.id).textContent=kn(v*p.cost)}

function moveForm(type,pid){openM(`<h2>${type}</h2><div class="fg"><label>Product</label><select class="in" id="m_p">${S.products.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="f2"><div class="fg"><label>${type==='Transfer'?'From branch':'Branch'}</label><select class="in" id="m_b">${BK.map(b=>`<option value="${b}">${BR[b]}</option>`).join('')}</select></div>
 ${type==='Transfer'?`<div class="fg"><label>To branch</label><select class="in" id="m_to">${BK.map(b=>`<option value="${b}" ${b==='B2'?'selected':''}>${BR[b]}</option>`).join('')}</select></div>`:'<div></div>'}
 <div class="fg"><label>Quantity ${type==='Adjustment'?'(+/−)':''}</label><input class="in" type="number" id="m_q" value="1"></div><div class="fg"><label>Reference / reason</label><input class="in" id="m_r" placeholder="${type==='Damaged'?'e.g. broken in transit':'Ref no.'}"></div></div>
 <div class="row"><span class="sp"></span><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="doMove('${type}')">Post</button></div>`)}
function doMove(type){const p=prod($('#m_p').value);const b=$('#m_b').value;let q=+$('#m_q').value;const r=$('#m_r').value||'-';const old=p.stock[b];
 if(type==='Damaged')q=-Math.abs(q);if(type==='Stock-in')q=Math.abs(q);
 if(type==='Transfer'){const to=$('#m_to').value;if(to===b){toast('Choose a different branch');return}q=Math.abs(q);if(q>p.stock[b]){toast('Not enough stock');return}p.stock[b]-=q;p.stock[to]+=q;S.moves.unshift({t:TODAY,type:'Transfer out',pid:p.id,qty:-q,branch:b,ref:r+' → '+BR[to],user:user()},{t:TODAY,type:'Transfer in',pid:p.id,qty:q,branch:to,ref:r+' ← '+BR[b],user:user()});log('Stock transfer',p.name+' ×'+q,BR[b],BR[to],'stock')}
 else{if(p.stock[b]+q<0){toast('Stock cannot go negative');return}p.stock[b]+=q;S.moves.unshift({t:TODAY,type:type==='Damaged'?'Damaged/Expired':type,pid:p.id,qty:q,branch:b,ref:r,user:user()});log('Stock '+type.toLowerCase(),p.name,old,p.stock[b],'stock')}

function policyHTML(){const P=[
 ['No LPO, no receiving','Goods are offloaded only against an approved, unexpired LPO. Deliveries with no LPO are refused at the gate and recorded.'],
 ['Two arrangements','Each LPO states whether the supplier delivers or Northworld collects. For collections, a driver and vehicle are recorded and the goods show as "in transit".'],
 ['The driver never receives','Goods collected by our driver are counted and received by the storekeeper at the receiving bay, exactly like a supplier delivery.'],
 ['Count every line','The storekeeper counts against the LPO on screen. Short quantities stay open (or are cancelled by a manager). Extra quantities are refused.'],
 ['Reject at the door','Damaged, expired, short-dated, wrong or poor-quality goods are rejected. The supplier\'s driver signs a Goods Return Note and a debit note is raised.'],
 ['No silent substitutes','Items not on the LPO stay on the vehicle. A manager must approve an LPO amendment before they are received; otherwise they go back.'],
 ['Emergency LPO','Only the General Manager can raise one, only for the items needed, and only the main admin can approve it. Above '+ks(EM_LIMIT)+' the Director also signs. Everything else goes back on the same vehicle.'],
 ['LPO price is the price','Northworld pays LPO prices. A higher invoice price is paid only if a manager accepts it at receiving.'],
 ['Three-way match before payment','LPO, GRN and supplier invoice must agree. Without an invoice, payment is blocked. If the invoice is higher, only accepted goods are paid and the difference becomes a debit note.'],
 ['LPOs expire',`An LPO is valid for ${LPO_DAYS} days after approval (emergency LPOs: 1 day). Expired LPOs cannot be received against.`],
 ['Separate duties','The person who requests, approves, receives and pays must be different people. The system blocks self-approval and driver self-receiving.'],
 ['Review monthly','Management reviews the supplier scorecard, emergency LPOs, refusals and disputes every month.']];
 return `<div class="grid k2"><div>${P.map((p,i)=>`<div style="display:flex;gap:10px;margin-bottom:12px"><span class="badge b-b" style="height:fit-content">${i+1}</span><div><b>${p[0]}</b><div class="small muted">${p[1]}</div></div></div>`).join('')}</div>
 <div><div class="card" style="box-shadow:none;background:#fafbf8"><h3>Who does what</h3><table>${[['Raise LPO','Storekeeper / General Manager'],['Approve LPO','General Manager or main admin — never the requester'],['Raise emergency LPO','General Manager only'],['Approve emergency LPO','Main admin only'],['Collect goods','Driver (recorded on the LPO)'],['Count & receive (GRN)','Storekeeper — never the driver'],['Approve substitutes / extras','General Manager or main admin'],['Enter & match invoice','Accountant'],['Approve payment / cheque','Main admin'],['Pay supplier','Accountant']].map(r=>kv(r[0],r[1])).join('')}</table></div>

const gross=e=>(+e.basic||0)+(+e.house||0)+(+e.transport||0)+(+e.other||0);
function calcPay(e){const g=gross(e);const nssf=Math.min(g,72000)*.06,shif=Math.max(300,g*.0275),ahl=g*.015;const tx=Math.max(0,g-nssf-shif-ahl);
 const bands=[[24000,.1],[8333,.25],[467667,.3],[300000,.325],[Infinity,.35]];let rem=tx,paye=0;for(const [w,r] of bands){const x=Math.min(rem,w);paye+=x*r;rem-=x;if(rem<=0)break}paye=Math.max(0,paye-2400);
 const adv=+e.advance||0;return {gross:g,nssf,shif,ahl,paye,adv,ded:nssf+shif+ahl+paye+adv,net:g-nssf-shif-ahl-paye-adv}}

function newApr(type,o){const a={id:'APR-'+(105+S.approvals.length),type,d:TODAY,t:nowT().slice(0,5),by:user(),role:S.role,status:'Pending',...o};S.approvals.unshift(a);const x=aprSummary(a);log('Approval requested',x.t+' · '+x.title.replace(/<[^>]+>/g,''),'-','Pending','edit');return a}
function canApprove(a){if(!a)return false;if(['lpo','lpo_amend'].includes(a.type))return MGR()&&a.by!==user();if(a.type==='emergency_lpo')return isAdmin()&&a.by!==user();return isAdmin()}
function approve(aid){const a=S.approvals.find(x=>x.id===aid);if(!a)return;if(!canApprove(a)){toast(a.by===user()?'You cannot approve your own request — another person must':'You are not allowed to approve this request');return}
 if(a.type==='lpo'||a.type==='emergency_lpo'){const po=S.pos.find(x=>x.id===a.ref);po.status='Approved';po.approvedBy=user();po.approvedOn=TODAY;po.rejReason='';po.validTo=addD(a.type==='emergency_lpo'?1:LPO_DAYS);po.hist.push([TODAY,'Approved by '+user()+' — valid to '+po.validTo])}
 if(a.type==='lpo_amend'){const g=S.grns.find(x=>x.id===a.ref);const l=g.extra[a.line];const p=prod(l.pid);l.status='Approved';if(p){p.stock[g.branch]+=l.qty;S.moves.unshift({t:TODAY,type:'Stock-in (LPO amendment)',pid:p.id,qty:l.qty,branch:g.branch,ref:g.id,user:user()});const v=l.qty*p.cost;g.value+=v;if(g.match!=='Awaiting invoice'){sup(g.supplier).balance+=v;addSinv(g.supplier,v,g.id+'-AMD')}}}
 if(a.type==='supplier_add'){const d=a.data;S.suppliers.push({id:id('S'),name:d.name,contact:d.contact,terms:+d.terms||30,rating:4,balance:0,category:d.category,person:d.person,address:d.address,email:d.email,kra:d.kra,since:TODAY,whatsapp:d.whatsapp||d.contact,payMethod:d.payMethod,fulfil:d.fulfil||'Delivery',bank:d.bank,status:'Active'})}
 if(a.type==='supplier_remove'){const i=S.suppliers.findIndex(s=>s.id===a.ref);if(i>=0){const s=S.suppliers.splice(i,1)[0];S.bin.unshift({kind:'supplier',item:s,by:user(),role:S.role,t:TODAY+' '+nowT().slice(0,5),why:a.note||'Approved removal'})}}
 if(a.type==='cheque'){const c=S.cheques.find(x=>x.id===a.ref);c.status='Approved';c.hist.push([TODAY,'Approved by '+user()])}
 if(a.type==='payroll'){const r=S.payruns.find(x=>x.id===a.ref);r.status='Approved'}
 a.status='Approved';a.decidedBy=user();a.decidedAt=TODAY+' '+nowT().slice(0,5);const x=aprSummary(a);log('Approved: '+x.t,x.title.replace(/<[^>]+>/g,''),'Pending','Approved','edit');toast('Approved');render()}
function rejectAsk(aid){openM(`<h2>Reject request</h2><div class="fg"><label>Reason for rejection (required)</label><input class="in" id="rj"></div><div class="row"><span class="sp"></span><button class="btn" onclick="closeM()">Cancel</button><button class="btn d" onclick="reject('${aid}')">Reject</button></div>`)}
function reject(aid){const why=$('#rj').value.trim();if(!why){toast('Give a reason');return}const a=S.approvals.find(x=>x.id===aid);if(!canApprove(a)){toast('You cannot decide this request');return}a.status='Rejected';a.reason=why;a.decidedBy=user();a.decidedAt=TODAY+' '+nowT().slice(0,5);
 if(a.type==='cheque'){const c=S.cheques.find(x=>x.id===a.ref);c.status='Rejected';c.hist.push([TODAY,'Rejected by '+user()+' — '+why])}if(a.type==='payroll'){const r=S.payruns.find(x=>x.id===a.ref);r.status='Rejected'}
 if(a.type==='lpo'||a.type==='emergency_lpo'){const po=S.pos.find(x=>x.id===a.ref);po.status='Rejected';po.rejReason=why;po.rejBy=user();po.hist.push([TODAY,'Rejected by '+user()+' — '+why])}
 if(a.type==='lpo_amend'){const g=S.grns.find(x=>x.id===a.ref);g.extra[a.line].status='Returned to supplier'}
 const x=aprSummary(a);log('Rejected: '+x.t,x.title.replace(/<[^>]+>/g,''),'Pending','Rejected — '+why,'delete');closeM();toast('Rejected');render()}

repData=function(rid){const [f,t]=prange(RF.period);const ip=d=>d>=f&&d<=t;const dok=p=>RF.dept==='All'||p.dept===RF.dept;const R={cols:[],rows:[],foot:null,note:''};const N=x=>({n:x});const sum=(L,i)=>L.reduce((a,r)=>a+(+String(r[i]).replace(/,/g,'')||0),0);
 const mv=fn=>S.moves.filter(m=>inB(m.branch)&&ip(m.t)&&fn(m));const mvRows=L=>L.map(m=>[m.t,m.type,esc(pname(m.pid)),BR[m.branch],m.qty>0?'+'+m.qty:m.qty,kn(Math.abs(m.qty)*((prod(m.pid)||{}).cost||0)),esc(m.ref),esc(m.user)]);const mvCols=['Date','Type','Item','Branch',N('Qty'),N('Value'),'Reference','By'];
 const ADJ=['Adjustment','Damaged/Expired','Stocktake variance','Stock adjustment'];
 switch(rid){
 case 'inv_status':{const L=S.products.filter(dok);R.cols=['Item','Dept',...BK.map(b=>N(BR[b])),N('Total'),N('Cost value'),N('Retail value'),'Status'];R.rows=L.map(p=>{const q=stockOf(p,'All');return [esc(p.name),p.dept,...BK.map(b=>p.stock[b]),q,kn(q*p.cost),kn(q*p.price),isLow(p,'All')?'Reorder':idle(p)>=30?'Not moving':'OK']});R.foot=['Total','',...BK.map(b=>kn(L.reduce((a,p)=>a+p.stock[b],0))),kn(L.reduce((a,p)=>a+stockOf(p,'All'),0)),kn(L.reduce((a,p)=>a+stockOf(p,'All')*p.cost,0)),kn(L.reduce((a,p)=>a+stockOf(p,'All')*p.price,0)),''];return R}
 case 'inv_items':{R.cols=['Code','Barcode','Item','Dept','Unit',N('Cost'),N('Retail'),N('Wholesale'),'VAT','Supplier'];R.rows=S.products.filter(dok).map(p=>[p.id,p.barcode,esc(p.name),p.dept,p.unit,kn(p.cost),kn(p.price),kn(wp(p)),p.tax+'%',esc(sup(p.supplier).name)]);return R}
 case 'inv_adj':R.cols=mvCols;R.rows=mvRows(mv(m=>ADJ.some(a=>m.type.startsWith(a))));return R;
 case 'inv_adj_pos':R.cols=mvCols;R.rows=mvRows(mv(m=>ADJ.some(a=>m.type.startsWith(a))&&m.qty>0));R.foot=['Total','','','',kn(sum(R.rows,4)),kn(sum(R.rows,5)),'',''];return R;
 case 'inv_adj_neg':R.cols=mvCols;R.rows=mvRows(mv(m=>ADJ.some(a=>m.type.startsWith(a))&&m.qty<0));R.foot=['Total','','','',kn(sum(R.rows,4)),kn(sum(R.rows,5)),'',''];return R;
 case 'inv_transfer':R.cols=mvCols;R.rows=mvRows(mv(m=>m.type.startsWith('Transfer')));return R;
 case 'inv_price':{const L=S.audit.filter(a=>/price change/i.test(a.action)&&ip(a.d)&&inB(a.br));R.cols=['Date','Time','Item','Type','Old','New','Changed by','Role'];R.rows=L.map(a=>[a.d,a.t.slice(0,5),esc(a.record),/cost/i.test(a.action)?'Cost price':'Selling price',esc(a.old),esc(a.nw),esc(a.user),a.role]);return R}
 case 'inv_negative':{const L=[];S.products.forEach(p=>BK.forEach(b=>{if(p.stock[b]<0)L.push([esc(p.name),BR[b],p.stock[b]])}));R.cols=['Item','Branch',N('Stock')];R.rows=L;R.note='The system blocks selling below zero, so negative stock should only appear after a data error.';return R}
 case 'sales_receipt':{const L=S.sales.filter(s=>inB(s.branch));R.cols=['Receipt','Time','Branch','Cashier','Customer',N('Items'),'Method','Level',N('Total'),'Status'];R.rows=L.map(s=>[s.id,s.time.slice(0,5),BR[s.branch],esc(s.cashier),esc((S.customers.find(c=>c.id===s.cust)||{name:'Walk-in'}).name),s.items.length,s.method,s.level||'Retail',kn(s.total),s.status]);R.foot=['Total','','','','','','','',kn(L.filter(s=>s.status==='Completed').reduce((a,s)=>a+s.total,0)),''];return R}
 case 'sales_person':{const g={};okSales().forEach(s=>{const k=s.salesPerson||'(none — till only)';g[k]=g[k]||{n:0,v:0};g[k].n++;g[k].v+=s.total});R.cols=['Sales person',N('Sales'),N('Value')];R.rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>[esc(k),v.n,kn(v.v)]);return R}
 case 'sales_customer':{const td={};okSales().forEach(s=>td[s.cust]=(td[s.cust]||0)+s.total);R.cols=['Customer','Category',N('Visits'),N('Lifetime spend'),N("Today's spend"),'Credit'];R.rows=S.customers.map(c=>[esc(c.name),c.cat,c.visits,kn(c.spent),kn(td[c.id]||0),c.credit?'Yes':'']).sort((a,b)=>+b[4].replace(/,/g,'')-+a[4].replace(/,/g,'')||+b[3].replace(/,/g,'')-+a[3].replace(/,/g,''));return R}
 case 'sales_level':{const g={};okSales().forEach(s=>{const k=s.level||'Retail';g[k]=g[k]||{n:0,v:0};g[k].n++;g[k].v+=s.total});const T=Object.values(g).reduce((a,x)=>a+x.v,0);R.cols=['Price level',N('Receipts'),N('Value'),N('Share')];R.rows=Object.entries(g).map(([k,v])=>[k,v.n,kn(v.v),pc(v.v,T)]);R.note='Wholesale prices are about 7% below retail and are used for bulk buyers.';return R}
 case 'sales_return':{const L=S.sales.filter(s=>s.status!=='Completed'&&inB(s.branch));const A=S.audit.filter(a=>ip(a.d)&&/Refund|Void/.test(a.action)&&inB(a.br));R.cols=['Date','Receipt / record','Type','By','Reason / note',N('Value')];R.rows=[...L.map(s=>[s.date,s.id,s.status,esc(s.cashier),'',kn(s.total)]),...A.filter(a=>!L.some(s=>s.id===a.record)).map(a=>[a.d,esc(a.record),esc(a.action),esc(a.user),esc(a.nw),esc(a.old)])];return R}
 case 'sales_tax':{const s=salesIn(f,t);R.cols=['Department','VAT rate',N('Sales incl. VAT'),N('Sales excl. VAT'),N('VAT')];R.rows=DEPTS.map(d=>{const g=s.byDept[d]||0,v=TAXD.includes(d)?vatOf(g):0;return [d,TAXD.includes(d)?'16%':'0% / exempt',kn(g),kn(g-v),kn(v)]});const ov=vatSales(f,t,S.branch);R.foot=['Total','',kn(s.rev),kn(s.rev-ov),kn(ov)];return R}
 case 'sales_comm':{const rate=1.5;const g={};okSales().filter(s=>s.salesPerson).forEach(s=>{g[s.salesPerson]=(g[s.salesPerson]||0)+s.total});R.cols=['Sales person',N('Sales value'),N('Rate'),N('Commission')];R.rows=Object.entries(g).map(([k,v])=>[esc(k),kn(v),rate+'%',kn(v*rate/100)]);R.foot=['Total',kn(sum(R.rows,1)),'',kn(sum(R.rows,3))];R.note='Commission rate is a placeholder (1.5% of sales credited to the sales person).';return R}
 case 'sales_tips':{const g={};okSales().filter(s=>s.tip).forEach(s=>{g[s.cashier]=g[s.cashier]||{n:0,v:0};g[s.cashier].n++;g[s.cashier].v+=s.tip});R.cols=['Cashier',N('Receipts with tips'),N('Tips')];R.rows=Object.entries(g).map(([k,v])=>[esc(k),v.n,kn(v.v)]);R.foot=['Total',sum(R.rows,1),kn(sum(R.rows,2))];R.note='Tips are held separately from sales revenue.';return R}
 case 'till_sum':{const g={};S.sales.filter(s=>inB(s.branch)).forEach(s=>{const k=s.cashier;g[k]=g[k]||{b:s.branch,n:0,Cash:0,'M-Pesa':0,Card:0,Credit:0,tip:0,ref:0,vd:0};const x=g[k];if(s.status==='Completed'){x.n++;x[s.method]+=s.total;x.tip+=s.tip||0}else if(s.status==='Refunded'){x.ref+=s.total}else x.vd+=s.total});
  R.cols=['Cashier','Branch',N('Receipts'),N('Float'),N('Cash'),N('M-Pesa'),N('Card'),N('Credit'),N('Tips'),N('Refunds'),N('Voids'),N('Expected cash')];R.rows=Object.entries(g).map(([k,x])=>[esc(k),BR[x.b],x.n,kn(S.shift.float),kn(x.Cash),kn(x['M-Pesa']),kn(x.Card),kn(x.Credit),kn(x.tip),kn(x.ref),kn(x.vd),kn(S.shift.float+x.Cash+x.tip-x.ref)]);R.foot=['Total','',sum(R.rows,2),'',kn(sum(R.rows,4)),kn(sum(R.rows,5)),kn(sum(R.rows,6)),kn(sum(R.rows,7)),kn(sum(R.rows,8)),kn(sum(R.rows,9)),kn(sum(R.rows,10)),kn(sum(R.rows,11))];return R}
 case 'pur_item':{const g={};S.pline.filter(l=>ip(l.d)&&inB(l.branch)).forEach(l=>{const p=prod(l.pid);if(!p||!dok(p))return;g[l.pid]=g[l.pid]||{q:0,v:0,n:0};g[l.pid].q+=l.qty;g[l.pid].v+=l.qty*l.cost;g[l.pid].n++});R.cols=['Item','Supplier',N('Deliveries'),N('Qty'),N('Avg cost'),N('Value')];R.rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>[esc(pname(k)),esc(sup(prod(k).supplier).name),x.n,kn(x.q),kn(x.v/x.q),kn(x.v)]);R.foot=['Total','',sum(R.rows,2),kn(sum(R.rows,3)),'',kn(sum(R.rows,5))];return R}
 case 'pur_loc':{R.cols=['Branch',N('Deliveries'),N('Value'),N('Share')];const L=S.pline.filter(l=>ip(l.d));const T=L.reduce((a,l)=>a+l.qty*l.cost,0);R.rows=BK.map(b=>{const x=L.filter(l=>l.branch===b);const v=x.reduce((a,l)=>a+l.qty*l.cost,0);return [BR[b],x.length,kn(v),pc(v,T)]});R.foot=['Total',L.length,kn(T),'100%'];return R}
 case 'pur_sup':{const g={};S.pline.filter(l=>ip(l.d)&&inB(l.branch)).forEach(l=>{g[l.sup]=g[l.sup]||{n:0,v:0};g[l.sup].n++;g[l.sup].v+=l.qty*l.cost});R.cols=['Supplier',N('Deliveries'),N('Value'),N('Outstanding now')];R.rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>[esc(sup(k).name),x.n,kn(x.v),kn(sup(k).balance)]);R.foot=['Total',sum(R.rows,1),kn(sum(R.rows,2)),''];return R}

 case 'pur_return':{R.cols=['Return note','Date','Supplier','GRN / LPO','Items','Debit note',N('Value')];R.rows=S.grtns.map(r=>[r.id,r.date,esc(sup(r.supplier).name),r.grn+' / '+r.po,r.lines.map(l=>l.qty+'× '+esc(l.name)+' ('+esc(l.reason)+')').join('; '),r.dn,kn(r.value)]);R.foot=['Total','','','','','',kn(S.grtns.reduce((a,r)=>a+r.value,0))];return R}
 case 'cust':{R.cols=['Customer','Phone','Category',N('Visits'),N('Total spent'),N('Points'),'Credit limit',N('Balance')];R.rows=S.customers.filter(c=>c.id!=='C1').map(c=>[esc(c.name),esc(c.phone),c.cat,c.visits,kn(c.spent),kn(c.points),c.credit?kn(c.credit.limit)+' / '+c.credit.terms+'d':'—',kn(c.bal||0)]);return R}
 case 'cus_bal':{const C=S.customers.filter(c=>c.credit||c.bal);R.cols=['Customer',N('Limit'),N('Balance'),N('Available'),N('Overdue')];R.rows=C.map(c=>{const ov=custOpen(c).filter(v=>v.due<TODAY).reduce((a,v)=>a+v.open,0);return [esc(c.name),kn(c.credit?c.credit.limit:0),kn(c.bal),kn((c.credit?c.credit.limit:0)-c.bal),kn(ov)]});R.foot=['Total','',kn(sum(R.rows,2)),'',kn(sum(R.rows,4))];return R}
 case 'cus_pay':{const L=S.cpay.filter(p=>ip(p.date));R.cols=['Date','Receipt','Customer','Method','Reference','Received by',N('Amount')];R.rows=L.map(p=>[p.date,p.id,esc(S.customers.find(c=>c.id===p.cust).name),p.method,esc(p.ref),esc(p.by),kn(p.amount)]);R.foot=['Total','','','','','',kn(L.reduce((a,p)=>a+p.amount,0))];return R}
 case 'cus_tx':{const rows=[];S.customers.filter(c=>c.credit).forEach(c=>{const I=S.cinv.filter(v=>v.cust===c.id).map(v=>({d:v.date,ref:v.id,desc:'Invoice'+(v.ref?' — '+v.ref:''),dr:v.amount,cr:0})),P=S.cpay.filter(p=>p.cust===c.id).map(p=>({d:p.date,ref:p.id,desc:'Payment ('+p.method+')',dr:0,cr:p.amount}));const L=[...I,...P].sort((a,b)=>a.d.localeCompare(b.d));let bal=c.bal-L.reduce((a,x)=>a+x.dr-x.cr,0);
  rows.push([`<b>${esc(c.name)}</b>`,'','Opening balance','','',`<b>${kn(bal)}</b>`]);L.forEach(x=>{bal+=x.dr-x.cr;rows.push([x.d,x.ref,x.desc,x.dr?kn(x.dr):'',x.cr?kn(x.cr):'',kn(bal)])})});R.cols=['Date','Ref','Description',N('Invoice'),N('Payment'),N('Balance')];R.rows=rows;return R}
 case 'cus_due':{const rows=[];S.customers.filter(c=>c.bal).forEach(c=>custOpen(c).forEach(v=>{if(v.due<=addD(7))rows.push([esc(c.name),v.id,v.date,v.due,v.due<TODAY?'<b class="dn">'+age(v.due)+' days overdue</b>':'Due in '+(-age(v.due))+' days',kn(v.amount),kn(v.open)])}));R.cols=['Customer','Invoice','Date','Due','Status',N('Amount'),N('Open')];R.rows=rows.sort((a,b)=>a[3].localeCompare(b[3]));R.foot=['Total','','','','','',kn(sum(rows,6))];return R}
 case 'cus_aging':{R.cols=['Customer',N('0–30 days'),N('31–60'),N('61–90'),N('90+'),N('Total')];R.rows=S.customers.filter(c=>c.bal).map(c=>{const B=buckets(custOpen(c));return [esc(c.name),...B.map(kn)]});R.foot=['Total',...[1,2,3,4,5].map(i=>kn(sum(R.rows,i)))];R.note='Age is counted from the invoice date. Payments clear the oldest invoices first.';return R}
 case 'sup_list':{R.cols=['Supplier','Category','Contact','Phone','WhatsApp','KRA PIN','Terms','Arrangement','Bank'];R.rows=S.suppliers.map(s=>[esc(s.name),esc(s.category),esc(s.person),esc(s.contact),esc(s.whatsapp||''),esc(s.kra),s.terms+' days',s.fulfil==='Collect'?'We collect':'Delivers',esc(s.bank.bank+' '+s.bank.acc)]);return R}
 case 'sup_pay':{const L=S.payments.filter(p=>ip(p.date));R.cols=['Date','Ref','Supplier','Method',N('Amount')];R.rows=L.map(p=>[p.date,p.id,esc(sup(p.supplier).name),esc(p.method),kn(p.amount)]);R.foot=['Total','','','',kn(L.reduce((a,p)=>a+p.amount,0))];return R}
 case 'sup_tx':{const rows=[];S.suppliers.forEach(s=>{const I=S.sinv.filter(v=>v.sup===s.id).map(v=>({d:v.date,ref:v.id,desc:v.ref,cr:v.amount,dr:0})),P=S.payments.filter(p=>p.supplier===s.id).map(p=>({d:p.date,ref:p.id,desc:'Payment ('+p.method+')',dr:p.amount,cr:0}));const L=[...I,...P].sort((a,b)=>a.d.localeCompare(b.d));let bal=s.balance-L.reduce((a,x)=>a+x.cr-x.dr,0);
  rows.push([`<b>${esc(s.name)}</b>`,'','Opening balance','','',`<b>${kn(bal)}</b>`]);L.forEach(x=>{bal+=x.cr-x.dr;rows.push([x.d,esc(x.ref),esc(x.desc),x.cr?kn(x.cr):'',x.dr?kn(x.dr):'',kn(bal)])})});R.cols=['Date','Ref','Description',N('Invoice'),N('Payment'),N('Balance')];R.rows=rows;return R}

 case 'sup_due':{const rows=[];S.suppliers.forEach(s=>supOpen(s).forEach(v=>{if(v.due<=addD(14))rows.push([esc(s.name),esc(v.id),v.date,v.due,v.due<TODAY?'<b class="dn">'+age(v.due)+' days overdue</b>':'Due in '+(-age(v.due))+' days',kn(v.open)])}));R.cols=['Supplier','Invoice','Date','Due','Status',N('Open')];R.rows=rows.sort((a,b)=>a[3].localeCompare(b[3]));R.foot=['Total','','','','',kn(sum(rows,5))];return R}
 case 'prod_batch':{const L=S.batches.filter(b=>ip(b.d)&&inB(b.branch));R.cols=['Batch','Date','Recipe','Branch',N('Runs'),'Output',N('Total cost'),N('Cost / unit'),'By'];R.rows=L.map(b=>{const r=S.recipes.find(x=>x.id===b.recipe);return [b.id,b.d,esc(r.name),BR[b.branch],b.times,b.outQty+' × '+esc(pname(r.out)),kn(b.cost),kn(b.cost/b.outQty),esc(b.by)]});return R}

const HRP=[
 ['1. Purpose','This protocol sets how Northworld Supermarket staff ask for time off, permission to leave work and salary advances, and how managers decide. Every request is made and decided in the system, so there is a record of who asked, who approved and when.'],
 ['2. Leave types and entitlements','Annual leave 21 working days a year (Employment Act minimum). Sick leave: 7 days full pay then 7 days half pay a year, after 2 months of service, with a doctor\'s note. Maternity leave 3 months on full pay. Paternity leave 2 weeks. Compassionate (funeral) leave up to 5 days a year. Emergency leave up to 3 days a year; beyond that it comes from annual leave. Unpaid and study leave at management\'s discretion.'],
 ['3. How to request leave','Annual leave: request at least 7 days ahead. Paternity/maternity: as early as possible (30 days for maternity). Name the colleague who will cover your work and a phone number while away. No one leaves until the request shows "Approved".'],
 ['4. Funeral and emergencies','In a death or emergency, call the General Manager first; the GM may allow you to leave at once. The request must then be recorded in the system within 24 hours (sick leave within 3 days). Bring the burial permit, death notice or other evidence within 7 days of returning. Muslim burials are often the same day — the GM can approve by phone and record it afterwards.'],
 ['5. Short permissions (hours)','For a few hours away during a shift (hospital, school, government office). Maximum 4 hours; longer absences need a leave request. The staff member clocks out and back in on the biometric terminal; approved permission hours are not counted as lateness or early exit.'],
 ['6. Salary advances','Only for genuine needs (medical, funeral, school fees, rent, family emergency). Up to 50% of net monthly pay; one open advance at a time; at most 3 a year; repaid by payroll deduction within 3 months; not for staff with less than 90 days\' service. The staff member signs the advance form agreeing to the deduction.'],

  if(!w){ w = document.createElement('div'); w.id = 'whoami'; w.className = 'whoami'; rb.parentNode.insertBefore(w, rb.nextSibling); }
  const p = A.profile || {};
  w.innerHTML = `<b>${H(p.name || '')}</b><span>${H(p.role || '')}</span>${A.pendingN && p.role === 'Super Admin' ? `<div style="margin-top:6px"><a href="#users" onclick="S.view='users';render();return false" style="color:#f5d27a">⏳ ${A.pendingN} account${A.pendingN>1?'s':''} waiting for approval</a></div>` : ''}<button onclick="nwSignOut()">Sign out</button>`;
};

/* ---------- Users page: real login accounts (Super Admin) ---------- */
const _vu = V.users;
V.users = function(){
  const base = _vu();
  if(!FB || S.role !== 'Super Admin') return base;
  setTimeout(loadAccounts, 0);
  return `<div class="card" id="fbacc"><h3>🔐 Login accounts</h3><p class="muted">Loading accounts…</p></div><div class="mt"></div>` + base;
};
const badge = s => s === 'active' ? '<span class="badge b-g">Active</span>' : s === 'pending' ? '<span class="badge b-a">Waiting</span>' : '<span class="badge b-r">Disabled</span>';
async function loadAccounts(){
  const box = document.getElementById('fbacc'); if(!box) return;
  try{
    const q = await db.collection('users').get();
    const L = q.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || String(a.name).localeCompare(b.name));
    A.pendingN = L.filter(x => x.status === 'pending').length;
    const opts = cur => Object.keys(ROLES).map(r => `<option ${r === cur ? 'selected' : ''}>${r}</option>`).join('');
    box.innerHTML = `<h3>🔐 Login accounts <span class="r small muted">${L.length} account${L.length===1?'':'s'} · ${A.pendingN} waiting</span></h3>
      <p class="small muted">Everyone signs in with their own email and password. New accounts stay <b>Waiting</b> until you approve them here and choose their role.</p>
      <div class="tw"><table class="stack"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Asked for</th><th>Role</th><th>Status</th><th></th></tr>
      ${L.map(u => { const me = A.user && u.id === A.user.uid; return `<tr><td><b>${H(u.name)}</b>${me ? ' <span class="small muted">(you)</span>' : ''}</td><td class="small">${H(u.email)}</td><td class="small">${H(u.phone || '—')}</td><td class="small">${H(u.requestedRole || '—')}</td>
        <td><select class="in" id="rl_${u.id}" ${me ? 'disabled' : ''}>${opts(ROLES[u.role] ? u.role : (ROLES[u.requestedRole] ? u.requestedRole : 'Cashier'))}</select></td><td>${badge(u.status)}</td>
        <td style="white-space:nowrap">${me ? '' : u.status === 'active' ? `<button class="btn sm" onclick="nwAcc('${u.id}','save')">Save role</button> <button class="btn sm d" onclick="nwAcc('${u.id}','disable')">Disable</button>` : u.status === 'pending' ? `<button class="btn sm p" onclick="nwAcc('${u.id}','approve')">Approve</button> <button class="btn sm d" onclick="nwAcc('${u.id}','disable')">Reject</button>` : `<button class="btn sm" onclick="nwAcc('${u.id}','approve')">Enable</button>`}</td></tr>`; }).join('')}
      </table></div>`;
    buildShell();
  }catch(err){ box.innerHTML = `<h3>🔐 Login accounts</h3><div class="alert">Could not load accounts: ${H(errText(err))}. Check the Firestore security rules.</div>`; }
}
window.nwAcc = async (id, act) => {
  const role = (document.getElementById('rl_' + id) || {}).value;
  const by = (A.profile && A.profile.name) || 'Admin';
  const upd = act === 'disable' ? {status: 'disabled', changedBy: by} : {role, status: 'active', approvedBy: by, approvedAt: firebase.firestore.FieldValue.serverTimestamp()};
  try{ await db.collection('users').doc(id).update(upd); toast(act === 'disable' ? 'Account disabled' : act === 'save' ? 'Role updated' : 'Account approved as ' + role); try{ log(act === 'disable' ? 'Disabled login' : 'Approved login', id, '-', role || '-', 'edit'); }catch(e){} loadAccounts(); }
  catch(err){ toast('Could not update: ' + errText(err)); }
};

/* ---------- start ---------- */
setImgs(); lock();
if(!FB){ go('setup'); }
else{
  firebase.initializeApp(NW_FIREBASE);
  auth = firebase.auth(); db = firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
  go('loading');
  auth.onAuthStateChanged(u => afterAuth(u));
}
}

</script>
</body>
</html>
